<!DOCTYPE html>
<html>
<head>
    <style>
        html body {
            font-family: Arial;
            width: 9.47in;
        }

        .wes-pagenumber-background {
            background: #e6e7e8;
            border-radius: 7px;
            font-size: 8pt; 
            padding: 0.2em 1em;
            width: 3em;
            float: left;
            text-align: center;
            vertical-align: top;
            word-spacing: 0.25em;
        }

        .wes-bg-contact-info {
            float: right
        }

            .wes-bg-contact-info > * {
                padding-right: 0.5em
            }

        .wes-bg-address {
            font-size: 6pt;
            display: inline-block;
            color: grey;
        }

        .wes-bg-phone {
            font-size: 6pt;
            display: inline-block;
            vertical-align: top;
            color: grey;
        }

        .wes-url {
            font-size: 8pt;
            display: inline-block;
            vertical-align: top;
        }

        .wes-light-blue {
            color: #28a8e0;
        }
    </style>
</head>
<body>
    <div>
        <br />
        <div class="wes-pagenumber-background">
            {page} // {total-pages}
        </div>
        <div class="wes-bg-contact-info">
            <span class="wes-bg-address">
                2450 Holcombe Blvd.<br />
                Grand Blvd. Receiving Dock<br />
                Houston, TX 77021-2024
            </span>
            <span class="wes-bg-phone">
                <span class="wes-light-blue">T</span> 1.800.411.4363<br />
                <span class="wes-light-blue">F</span> 1.800.434.9850
            </span>
            <span>
                <span class="wes-light-blue wes-url">baylorgenetics.com</span>
            </span>
        </div>
    </div>
</body>
</html>
